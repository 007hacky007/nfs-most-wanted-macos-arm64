name: Release

on:
  push:
    tags:
      - "v*"
  # A dry run from the Actions tab: tests and builds the Builder and its disk
  # image, publishes nothing.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    # Tests take about 2 minutes; an uncached Boost and xz build up to about 20 on a runner.
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      # Builder version: the tag without its "v"; dry runs build 0.0.0.
      VERSION_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v0.0.0' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The release's notes are its CHANGELOG.md section: a tag without one stops here,
      # before anything is built.
      - name: Release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          python tools/release_notes.py "$VERSION_TAG" > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt dmgbuild==1.6.7

      - name: Test
        run: |
          set -euo pipefail
          python tools/run_ci_tests.py
          swift test --package-path builder

      # Boost and xz are built from pinned sources for macOS 12; reuse them while
      # tools/build_helpers.py (which holds the pins and flags) is unchanged.
      - uses: actions/cache@v6
        with:
          path: out/helpers-work/deps
          key: helpers-deps-${{ runner.os }}-${{ hashFiles('tools/build_helpers.py') }}

      - name: Check helper build tools
        run: |
          set -euo pipefail
          cmake --version
          rustc --version

      - name: Build helpers
        run: |
          set -euo pipefail
          python tools/build_helpers.py --output helpers --work out/helpers-work

      - name: Build app
        run: |
          set -euo pipefail
          VERSION="${VERSION_TAG#v}"
          python tools/make_builder.py --version "$VERSION" --output dist --helpers helpers

      - name: Build disk image
        run: |
          set -euo pipefail
          VERSION="${VERSION_TAG#v}"
          dmgbuild -s builder/dmg/settings.py -D app="dist/NFSMW Builder.app" "NFSMW Builder $VERSION" dist/NFSMW-Builder.dmg
          (cd dist && shasum -a 256 NFSMW-Builder.dmg > NFSMW-Builder.dmg.sha256)

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${VERSION_TAG#v}"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/NFSMW-Builder.dmg dist/NFSMW-Builder.dmg.sha256 --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/NFSMW-Builder.dmg dist/NFSMW-Builder.dmg.sha256 \
              --title "NFSMW Builder $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
          fi
